<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>NAPIER v2.0 - National Airfare Price Index Engine</title>
  <meta name="description" content="National Airfare Price Index Engine: live one-way fares, forecasts and archived index trends.">
  <link rel="canonical" href="https://rkrworks.github.io/Napier/docs/">
  <script>
    // Seamless instant client redirect to docs/ if served from repository root
    var target = "docs/" + (window.location.search || "") + (window.location.hash || "");
    window.location.replace(target);
  </script>
  <meta http-equiv="refresh" content="0; url=docs/">
  <style>
    body {
      background-color: #060913;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 1rem;
    }
    .badge {
      font-family: monospace;
      font-size: 1.5rem;
      font-weight: 900;
      letter-spacing: 0.1em;
      background: linear-gradient(90deg, #06b6d4, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(6, 182, 212, 0.2);
      border-top-color: #06b6d4;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 1rem;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    a {
      color: #06b6d4;
      text-decoration: underline;
      font-size: 0.875rem;
    }
  </style>
</head>
<body>
  <div class="badge">NAPIER v2.0</div>
  <div class="spinner"></div>
  <p style="font-size: 0.9rem; color: #94a3b8; margin: 0 0 1rem 0;">
    Initializing Spatial Glass Flight Telemetry Engine...
  </p>
  <a href="docs/">Click here if not redirected automatically &rarr;</a>
</body>
</html>
